name: DSP sanitizers

# Linux ist guenstig. Laeuft nur bei Aenderungen an DSP, Tests oder Build und bei manuellem Start.
on:
  push:
    branches: [main]
    paths: ['Source/RadiophoneDSP.h', 'Tests/**', 'CMakeLists.txt', '.github/workflows/sanitizers.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dsp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        sanitizer: ['address,undefined', 'thread']
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DRADIOPHONE_DSP_ONLY=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
