name: DSP sanitizers
# Guenstiger Linux-Lauf (ohne JUCE): nur bei Code-/Testaenderungen, nicht bei Doku. Siehe docs/CI.md
on:
  pull_request:
    types: [opened, ready_for_review]
    paths: ['Source/**', 'Tests/**', 'CMakeLists.txt', 'VERSION', '.github/workflows/sanitizers.yml']
  push:
    branches: [main]
    paths: ['Source/**', 'Tests/**', 'CMakeLists.txt', 'VERSION', '.github/workflows/sanitizers.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dsp-sanitizers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dsp:
    if: github.event_name != 'pull_request' || ! github.event.pull_request.draft
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer: ['address,undefined', 'thread']
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DRADIOPHONE_DSP_ONLY=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer"
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
