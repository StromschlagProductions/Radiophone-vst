name: Windows-VST3 bauen

# Sparsamer Betrieb (GitHub-Actions-Kontingent, Windows-Minuten zaehlen doppelt):
# - Kein Lauf mehr bei jedem Push oder PR-Update. Entwickelt und getestet wird lokal.
# - Der Windows-Bau mit Regressionstests und pluginval (Strictness 8) laeuft auf Anforderung als Abnahme:
#   GitHub -> Actions -> "Windows-VST3 bauen" -> "Run workflow".
# - Ein Release entsteht nur, wenn "publish" angehakt wird (Standard: aus), nur auf main.
# Beschreibung: docs/CI.md
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a public release (explicit approval required)"
        type: boolean
        default: false

concurrency:
  group: windows-vst3-${{ github.ref }}
  cancel-in-progress: ${{ ! inputs.publish }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          if ($v -notmatch '^(0|[1-9][0-9]*)\.[0-9]$') { throw "VERSION muss dem Schema 1.0 ... 1.9, 2.0 ... folgen" }
          "RPH_VERSION=$v" >> $env:GITHUB_ENV
          "ZIP_NAME=Radiophone-v$v-Windows-VST3.zip" >> $env:GITHUB_ENV
          if (-not (Test-Path "docs/releases/$v.md")) { throw "Release-Hinweise fuer $v fehlen" }
          if ("${{ inputs.publish }}" -eq "true" -and "${{ github.ref }}" -ne "refs/heads/main") { Write-Error "Release nur auf main"; exit 1 }

      - name: Screenshot-Version vor Veroeffentlichung pruefen
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          $manifest = Get-Content docs/screenshots.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $v) { throw "Screenshots fuer $v mit dem Screenshot-Werkzeug neu erzeugen" }
          if ($manifest.images.Count -lt 2) { throw "Screenshot-Varianten fehlen" }
          foreach ($image in $manifest.images) {
            if ($image -notmatch '^oberflaeche-[a-z]+\.png$' -or -not (Test-Path "docs/$image")) { throw "Screenshot fehlt: $image" }
          }

      - name: Herstelleridentitaet pruefen
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'COMPANY_NAME\s+"Stromschlag Audio"') { throw "Hersteller muss Stromschlag Audio sein" }
          if ($cmake -match '(?i)COMPANY_NAME\s+"[^"]*(Claude|Anthropic)') { throw "Falscher Plugin-Hersteller" }

      - name: Konfigurieren
        run: cmake -B build -A x64

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Gebaute VST3-Version pruefen
        shell: pwsh
        run: |
          $bundle = "build/Radiophone_artefacts/Release/VST3/Radiophone.vst3"
          $metadata = Get-Content "$bundle/Contents/Resources/moduleinfo.json" -Raw
          $match = [regex]::Match($metadata, '"Version"\s*:\s*"([^"]+)"')
          $allowed = '^' + [regex]::Escape($env:RPH_VERSION) + '(\.0){0,2}$'
          if (-not $match.Success -or $match.Groups[1].Value -notmatch $allowed) { throw "VST3-Metadaten passen nicht zu VERSION" }
          $native = (Get-Item "$bundle/Contents/x86_64-win/Radiophone.vst3").VersionInfo
          foreach ($value in @($native.FileVersion, $native.ProductVersion)) {
            if ($value -notmatch $allowed) { throw "Windows-Binaerversion $value passt nicht zu VERSION" }
          }
          Write-Host "VST3 und Windows-Binaerdatei entsprechen $env:RPH_VERSION"

      - name: Regressionstests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Plugin bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Radiophone-VST3-Windows
          path: build/Radiophone_artefacts/Release/VST3
          if-no-files-found: error
          retention-days: 7

      - name: Stabilitaetstest (pluginval)
        shell: pwsh
        run: |
          curl.exe -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 8 --validate-in-process --validate "build/Radiophone_artefacts/Release/VST3/Radiophone.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: ZIP packen
        shell: pwsh
        run: Compress-Archive -Path "build/Radiophone_artefacts/Release/VST3/Radiophone.vst3" -DestinationPath "$env:ZIP_NAME"

      - name: Release mit ZIP erstellen
        if: inputs.publish && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RPH_VERSION }}
          name: Radiophone v${{ env.RPH_VERSION }}
          make_latest: true
          files: |
            ${{ env.ZIP_NAME }}
            docs/screenshots.json
          body_path: docs/releases/${{ env.RPH_VERSION }}.md
