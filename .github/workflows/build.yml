name: Windows-VST3 bauen

# Sparsamer Betrieb (GitHub-Actions-Kontingent, Windows-Minuten zaehlen doppelt):
# - Kein Lauf mehr bei jedem Push oder PR-Update. Entwickelt und getestet wird lokal.
# - Der Windows-Bau mit Regressionstests und pluginval (Strictness 8) laeuft auf Anforderung als Abnahme:
#   GitHub -> Actions -> "Windows-VST3 bauen" -> "Run workflow".
# - Ein Release entsteht nur, wenn "publish" angehakt wird (Standard: aus), nur auf main.
# Beschreibung: docs/CI.md
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a public release (explicit approval required)"
        type: boolean
        default: false

concurrency:
  group: windows-vst3-${{ github.ref }}
  cancel-in-progress: ${{ ! inputs.publish }}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          "RPH_VERSION=$v" >> $env:GITHUB_ENV
          if ("${{ inputs.publish }}" -eq "true" -and "${{ github.ref }}" -ne "refs/heads/main") { Write-Error "Release nur auf main"; exit 1 }

      - name: Herstelleridentitaet pruefen
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'COMPANY_NAME\\s+"Stromschlag Audio"') { throw "Hersteller muss Stromschlag Audio sein" }
          if ($cmake -match '(?i)COMPANY_NAME\\s+"[^"]*(Claude|Anthropic)') { throw "Falscher Plugin-Hersteller" }

      - name: Konfigurieren
        run: cmake -B build -A x64

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Regressionstests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Plugin bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Radiophone-VST3-Windows
          path: build/Radiophone_artefacts/Release/VST3
          if-no-files-found: error
          retention-days: 7

      - name: Stabilitaetstest (pluginval)
        shell: pwsh
        run: |
          curl.exe -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 8 --validate-in-process --validate "build/Radiophone_artefacts/Release/VST3/Radiophone.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: ZIP packen
        shell: pwsh
        run: Compress-Archive -Path "build/Radiophone_artefacts/Release/VST3/Radiophone.vst3" -DestinationPath "Radiophone-VST3-Windows.zip"

      - name: Release mit ZIP erstellen
        if: inputs.publish && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RPH_VERSION }}-b${{ github.run_number }}
          name: Radiophone v${{ env.RPH_VERSION }}
          make_latest: true
          files: |
            Radiophone-VST3-Windows.zip
          body_path: docs/RELEASE_NOTES_1.5.md
