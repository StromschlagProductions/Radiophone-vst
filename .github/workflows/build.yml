name: Windows-VST3 bauen

# Vollstaendiger Windows-Bau nur fuer die Abnahme: nach dem Merge auf main oder manuell.
# Zwischencommits auf Branches und Pull Requests loesen keinen Lauf aus (spart Actions-Minuten,
# Windows-Minuten zaehlen doppelt). Lokal bauen und testen: siehe docs/CI.md.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', '.github/workflows/sanitizers.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a public release (explicit approval required)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # ueberholte Laeufe auf demselben Branch abbrechen

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          "RPH_VERSION=$v" >> $env:GITHUB_ENV

      - name: Konfigurieren
        run: cmake -B build -A x64

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: Regressionstests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Plugin bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Radiophone-VST3-Windows
          path: build/Radiophone_artefacts/Release/VST3
          if-no-files-found: error

      - name: Stabilitaetstest (pluginval)
        shell: pwsh
        run: |
          curl.exe -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 8 --validate-in-process --validate "build/Radiophone_artefacts/Release/VST3/Radiophone.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: ZIP packen
        shell: pwsh
        run: Compress-Archive -Path "build/Radiophone_artefacts/Release/VST3/Radiophone.vst3" -DestinationPath "Radiophone-VST3-Windows.zip"

      - name: Release mit ZIP erstellen
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RPH_VERSION }}-b${{ github.run_number }}
          name: Radiophone v${{ env.RPH_VERSION }}
          make_latest: true
          files: |
            Radiophone-VST3-Windows.zip
          body: "Windows-VST3 aus dem automatischen Bau. Entpacken, Ordner Radiophone.vst3 nach C:\\Program Files\\Common Files\\VST3 kopieren."
